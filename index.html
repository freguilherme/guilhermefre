<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guilherme Fré — Portfólio</title>
  <meta name="description" content="Portfólio de Guilherme Fré: experiência, tecnologias, projetos e contato." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>⌨️</text></svg>" />
</head>
<body>
  <!-- Cabeçalho fixo: barra de título + abas como menu -->
  <header class="topbar">
    <div class="titlebar">
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <a class="brand" href="#inicio">~/guilhermefre</a>
      <a class="btn btn-sm" id="navGithub" target="_blank" rel="noopener">⌥ GitHub ↗</a>
      <a class="btn btn-sm primary" id="navLinkedin" target="_blank" rel="noopener">in/ LinkedIn ↗</a>
    </div>
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  </header>

  <main id="content"></main>

  <!-- Rodapé estilo status bar -->
  <footer class="statusbar">
    <span>⎇ main</span>
    <span id="sbStatus"></span>
    <span class="grow"></span>
    <span class="hide-sm" id="sbCopy"></span>
    <a href="#inicio">↑ topo</a>

  <script src="js/data.js"></script>
